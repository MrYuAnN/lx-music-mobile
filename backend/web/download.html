<style>
/* 更新日志分组样式（批 R·D5；2026-11-04 ②段落小节；规则单源=App 端 src/utils/changelog.ts） */
.note-groups { margin-top: 8px; display: grid; gap: 10px; }
.note-section { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-top: 4px; }
.note-section-bar { width: 3px; height: 14px; border-radius: 1.5px; background: #1a73e8; }
.note-group ul { margin: 6px 0 0; padding-left: 18px; }
.note-group li { margin: 2px 0; }
.note-badge { display: inline-block; font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 6px; border: 1px solid; }
</style>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = ts => new Date(ts * 1000).toLocaleDateString('zh-CN', {year: 'numeric', month: '2-digit', day: '2-digit'});
// note 行前缀分组+段落层（批 R·D5；2026-11-04 ②段落扩展）：与 App 端 src/utils/changelog.ts
// 同规则——前缀「新增/修复/优化」（容错半角冒号与前导空白）、「更新」前缀剥除归默认组、
// 无前缀行归「更新」、空行忽略、组序恒 add→fix→improve→other；段落行=全行【1-12 字标题】
// 包裹（显式特征，存量 note 零重渲染），标题行前内容归默认区。对拍锚点=
// src/utils/changelog.test.mts 段落组用例。规则改动操作链：先改 changelog.ts+用例，
// 再同步本文件实现，最后跑 `node --test src/utils/changelog.test.mts`+本文件锚点双侧对拍
const NOTE_PREFIXES = [['新增','add'],['修复','fix'],['优化','improve'],['更新','other']];
const NOTE_ORDER = ['add','fix','improve','other'];
const SECTION_RXP = /^【([^【】]{1,12})】$/;
const parseNoteSections = note => {
  const sections = [];
  let current = null;
  const ensureCurrent = () => {
    if (!current) { current = {title: null, groups: new Map()}; sections.push(current); }
    return current;
  };
  for (const raw of String(note ?? '').split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;
    const sm = SECTION_RXP.exec(line);
    if (sm) { current = {title: sm[1], groups: new Map()}; sections.push(current); continue; }
    const bucket = ensureCurrent().groups;
    const matched = NOTE_PREFIXES.find(([p]) => line.startsWith(p) && (line[p.length] === '：' || line[p.length] === ':'));
    const key = matched ? matched[1] : 'other';
    const text = matched ? line.slice(matched[0].length + 1).trim() : line;
    if (!bucket.has(key)) bucket.set(key, []);
    bucket.get(key).push(text);
  }
  return sections
    .map(({title, groups}) => ({title, groups: NOTE_ORDER.filter(k => groups.has(k)).map(k => ({key: k, lines: groups.get(k)}))}))
    .filter(s => s.groups.length);
};
const parseNote = note => {
  const merged = new Map();
  for (const {groups} of parseNoteSections(note)) for (const g of groups) {
    if (!merged.has(g.key)) merged.set(g.key, []);
    merged.get(g.key).push(...g.lines);
  }
  return NOTE_ORDER.filter(k => merged.has(k)).map(k => ({key: k, lines: merged.get(k)}));
};
const NOTE_LABEL = {add:'新增', fix:'修复', improve:'优化', other:'更新'};
const NOTE_COLOR = {add:'#1e8e3e', fix:'#b26a00', improve:'#1a73e8', other:'#5f6368'};
const renderNote = note => {
  const sections = parseNoteSections(note);
  let html = '';
  for (const s of sections) {
    // 段落小节标题（净屏 v1.7.8 蓝竖条式样，与 App 端 ChangelogNote 同构）
    if (s.title) html += '<div class="note-section"><span class="note-section-bar"></span>' + esc(s.title) + '</div>';
    for (const g of s.groups) {
      const c = NOTE_COLOR[g.key];
      html += '<div class="note-group"><span class="note-badge" style="color:' + c + ';border-color:' + c + '55;background:' + c + '14">' + NOTE_LABEL[g.key] + '</span>' +
        '<ul>' + g.lines.map(l => '<li>' + esc(l) + '</li>').join('') + '</ul></div>';
    }
  }
  return html ? '<div class="note-groups">' + html + '</div>' : '';
};
fetch('/latest', {signal: AbortSignal.timeout(8000)}).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(d => {
  document.getElementById('ver').textContent = 'v' + d.version;
  document.getElementById('dl-main').href = d.url;
  const list = document.getElementById('releases');
  list.innerHTML = (d.releases || []).map(r =>
    '<div class="card"><b>v' + esc(r.version) + '</b> <span class="muted">' + fmtDate(r.released_at) + '</span>' +
    renderNote(r.note) +
    '</div>').join('') || '<p class="muted">暂无历史版本</p>';
}).catch(() => {
  document.getElementById('ver').textContent = '暂未发布';
  document.getElementById('releases').innerHTML = '<p class="muted">暂未发布</p>';
});
</script>
<script src="/static/beacon.js?v=beacon1"></script>
</body>
