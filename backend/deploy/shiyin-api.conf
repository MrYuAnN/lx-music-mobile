# 拾音对外域 — nginx-gateway 拾音专用 server block（方案 §二/§四）
#
# 部署位：nginx-gateway 仓 nginx/conf.d/（本文件 + shiyin-sec-headers.conf 两个都拷），
# 拷贝后 nginx -t && systemctl reload nginx
# 前提：
#   1.【对外域】= 境外注册商新购域名；EdgeOne 回源 Host 改写为【回源子域】
#      （已备案域 a-stock.top 系新子域，如 sy-api.a-stock.top——仅作 Host 头标识，
#      无需公网 A 记录；DNS-01 证书 SAN 必须覆盖它）。
#   2.【EdgeOne 回源 IP 段】= 官方 API 拉取的回源网段（会变化，须自动更新，
#      见 DEPLOY.md §6）；白名单外直连源站一律 403 拒绝。
#   3. 上游：轻服务 172.20.0.1:8090 / 取链服务 172.20.0.1:8091 / 平台 172.20.0.1:8080。
#
# add_header 继承陷阱（2026-10-26 审查 S-12）：location 内只要出现任一 add_header，
# server 级安全头即不继承——故全部动态 location 统一 include shiyin-sec-headers.conf
# （4 个安全头 + no-store）；/ 与 /dl/ 无 location 级 add_header，正常继承 server 级四件套。
#
# 上线检查单：证书 SAN 覆盖回源子域；回源 TLS 握手通过；白名单外直连源站被拒（403）；
# 动态接口禁缓存（本 block 响应头 + EdgeOne 控制台规则双保险，清单=/url /config /register
# /activate /redeem /device /api /latest /dash）；/dl/ APK 直链 200。

# 【对外域】与【回源子域】同 block（回源时 Host=回源子域，用户侧 Host=对外域；
# server_name 两个都收，行为一致——避免改写后落错 block）
server {
    listen 80;
    server_name 【对外域】【回源子域】;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name 【对外域】【回源子域】;
    # 证书 SAN 必须同时覆盖两个域名（certbot -d 两个都签；DNS-01）
    ssl_certificate     /etc/letsencrypt/live/【回源子域】/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/【回源子域】/privkey.pem;

    # 安全响应头（仅对无 location 级 add_header 的路径生效：/ 与 /dl/；
    # 动态 location 见 shiyin-sec-headers.conf）
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- 回源 IP 白名单（防线 2）：include 文件由白名单更新任务重写 ----
    include /etc/nginx/conf.d/shiyin-edge-allow.conf;
    deny all;

    # ---- 取链服务（fork lx-music-api-server，172.20.0.1:8091）----
    location /url/ {
        proxy_pass http://172.20.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }
    location /register {
        proxy_pass http://172.20.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }
    location /config {
        proxy_pass http://172.20.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }

    # ---- 平台公网端点（license-platform 172.20.0.1:8080；App 单域直打）----
    location /activate {
        proxy_pass http://172.20.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }
    location /redeem {
        proxy_pass http://172.20.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }
    location /device/ {
        proxy_pass http://172.20.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }
    location /api/ {
        proxy_pass http://172.20.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }

    # ---- 轻服务（172.20.0.1:8090）：/latest + /dash + 官网静态页 ----
    # /latest 永不设版本门槛（强升死锁防线，方案 §七）
    location /latest {
        proxy_pass http://172.20.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }
    location /dash {
        proxy_pass http://172.20.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }
    location / {
        proxy_pass http://172.20.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # APK 直链托管（DEPLOY.md §2 发布链的 url 指向此处；继承 server 级安全头，
    # 不加 no-store——APK 大文件允许 EdgeOne 边缘缓存省回源带宽）
    location /dl/ {
        alias /root/shiyin/apk/;
        autoindex off;
    }
}
