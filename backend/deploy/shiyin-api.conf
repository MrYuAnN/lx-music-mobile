# 拾音对外域 — nginx-gateway 拾音专用 server block（方案 §二/§四；
# 2026-11-03 音乐域直连批修订：撤回源白名单判定+新增 limit_req，方案
# doc/plans/music-domain-direct.md §三）
#
# 部署位：nginx-gateway 仓 nginx/conf.d/（本文件 + shiyin-sec-headers.conf 两个都拷），
# 拷贝后 nginx -t && systemctl reload nginx
# 形态（2026-11-03 起）：
#   1.【对外域】shiyinbox.top（EdgeOne 链路）= 存量装机（vc≤11）主链路+本批回退兜底；
#      【直连子域】sy-api.a-stock.top（DNS A 记录直指本 VPS）= vc12+ 主链路
#      （App 三常量 SHIYIN_BASE_URL/SHIYIN_HOST/LATEST_URL 已切）。
#   2.【回源白名单已撤】（geo 判定+if 403 退役）：「白名单漂移=回源失败=全量取链
#      不可用」单点退役；edge-allow-update.sh 的 allow.geo 与 realip 网段**同源生成
#      均保留**（allow.geo 供回退「conf 改回防护形态」时判定依据，停更=回退链自带
#      故障——EdgeOne 扩段后回退即 403；脚本观测输入已从「403 被拒」改为
#      「回源形态（XFF 非空）且来源不在信任表」，见 DEPLOY.md §6）。
#   3. 上游：轻服务 172.20.0.1:8090 / 取链服务 172.20.0.1:8091 / 平台 172.20.0.1:8080。
#
# add_header 继承陷阱（2026-10-26 审查 S-12）：location 内只要出现任一 add_header，
# server 级安全头即不继承——故全部动态 location 统一 include shiyin-sec-headers.conf
# （4 个安全头 + no-store）；/ 与 /dl/ 无 location 级 add_header，正常继承 server 级四件套。
#
# 上线检查单（2026-11-03 直连批更新）：证书 SAN 覆盖双域（至 2027-01-25）；直连
# TLS 握手通过；**直连 403 拒绝已撤**（403/TLS 失败症状区分：TLS 失败=证书异常、
# 403=旧判定残留）；realip 生效（XFF 回源请求上游看到 X-Real-IP=真实客户端 IP）；
# 动态接口禁缓存（本 block 响应头 no-store + EdgeOne 控制台规则双保险）；/dl/ 直链 200。
#
# CDN 真实客户端 IP 还原（2026-10-27 审查 C-1）：EdgeOne 前置下 $remote_addr=回源边缘 IP，
# 直接传给上游会让「注册 IP 日限」按边缘 IP 分桶（全员共享桶，误伤+可被耗尽）。
# realip 三件套把 $remote_addr 改写为 X-Forwarded-For 中的真实客户端 IP：
#   set_real_ip_from <EdgeOne 网段>（include 文件与 allow.geo 同源生成，见 DEPLOY.md §6）
#   real_ip_header X-Forwarded-For; real_ip_recursive on;
# 注意：仅本 server block 生效；净屏/投研 block 为直连形态，$remote_addr 本就是真实 IP，不动。
#
# **realip 是 limit_req 的前置依赖（2026-11-03 方案审查复审 I-B）**：realip 在
# PREACCESS 阶段改写先于 limit_req（ACCESS 阶段）求值——limit_req_zone 的
# $binary_remote_addr 拿到的已是「回源=真实用户 IP / 直连=直连 IP」，双键语义由
# realip 天然承担；勿自建「XFF 首跳」map（首跳可被伪造换 key 绕过，
# realip_recursive on 从右跳可信段取值天然抗伪造）。
#
# 观测日志（格式沿用）：edge-allow-update.sh 据此观测回源边缘 IP（判据：XFF 非空
# =回源形态+whois 腾讯归属；2026-11-03 起观测输入=回源形态请求而非 403 被拒——
# 判定已撤无 403 可观测）。$realip_remote_addr=realip 改写前的原始来源（=边缘 IP），
# $remote_addr 已被还原为真实用户 IP，勿混用。status 恒置行尾，脚本 awk '{print $NF}'
# 取用；分析后脚本原地清空该文件。存量装机消亡统计（旧域下线判据）也靠本日志
# 「来源∈腾讯段/XFF 非空」计数（方案 §六.4）。

log_format shiyin_edge '$time_iso8601 $realip_remote_addr [$ssl_server_name] [$http_x_forwarded_for] "$request" $status';

# ---- limit_req（2026-11-03 直连批，方案 §三.3；复审 I-B 落法）----
# key=$binary_remote_addr=realip 还原后真实 IP；分 zone：/url+/register 共用（同取链
# 链路）、/config 独立（防空集自愈链 3s 起步重试挤占取链计数，独立调参）；
# 429 状态码见 server 级 limit_req_status 注释；/dl 不限流（大文件带宽风险见方案 §五）。
limit_req_zone $binary_remote_addr zone=sy_url:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sy_config:10m rate=10r/s;

server {
    listen 80;
    server_name shiyinbox.top sy-api.a-stock.top;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name shiyinbox.top sy-api.a-stock.top;
    access_log /var/log/nginx/shiyin_edge.log shiyin_edge;

    # 证书 SAN 必须同时覆盖两个域名（certbot -d 两个都签；DNS-01 --manual：
    # shiyinbox.top TXT 在 EdgeOne 控制台加、sy-api.a-stock.top TXT 在阿里云控制台加，
    # 跨 DNS 商单插件不可行；lineage 名=回源子域，与 conf 引用一致）
    ssl_certificate     /etc/letsencrypt/live/sy-api.a-stock.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sy-api.a-stock.top/privkey.pem;

    # realip 还原（信任来源=EdgeOne 回源网段，include 与白名单同源自动更新）
    include /etc/nginx/conf.d/shiyin-edge-realip.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;


    # 安全响应头（仅对无 location 级 add_header 的路径生效：/ 与 /dl/；
    # 动态 location 见 shiyin-sec-headers.conf）
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- 限流状态码（2026-11-03 方案审查 I-2）：默认 503 会落 App「5xx→可重试
    # （交换源链）」分支触发逐源重试放大（client.ts 异常分类）；429=App 提示不自动重试 ----
    limit_req_status 429;

    # ---- 取链服务（fork lx-music-api-server，172.20.0.1:8091）----
    location /url/ {
        limit_req zone=sy_url burst=20 nodelay;
        proxy_pass http://172.20.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }
    location /register {
        limit_req zone=sy_url burst=20 nodelay;
        proxy_pass http://172.20.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }
    location /config {
        limit_req zone=sy_config burst=20 nodelay;
        proxy_pass http://172.20.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }

    # ---- 平台公网端点（license-platform 172.20.0.1:8080；App 单域直打）----
    location /activate {
        proxy_pass http://172.20.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }
    location /redeem {
        proxy_pass http://172.20.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }
    location /device/ {
        proxy_pass http://172.20.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }
    # ---- 订单域（批2 拾音订单域接线，方案 doc/plans/shiyin-order-domain.md）----
    # 精确/前缀 location 接管（= 形态防劫持 /api/skus/install 与 /api/trial-claim
    # ——两者依赖下方 /api/ 前缀兜底继续指向平台）；shiyin-server 8090 mux 并入
    # （方案选型 B：零进程结构变更），回滚=摘本三段 location 即回平台 8080
    #（窗口=批3 App 发版前；发版后不得摘，见方案批2 回滚口径）。
    location = /api/skus {
        proxy_pass http://172.20.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }
    location /api/order/ {
        proxy_pass http://172.20.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }
    location = /api/orders {
        proxy_pass http://172.20.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }

    location /api/ {
        proxy_pass http://172.20.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }

    # ---- 轻服务（172.20.0.1:8090）：/latest + /dash + 官网静态页 ----
    # /latest 永不设版本门槛（强升死锁防线，方案 §七）
    location /latest {
        proxy_pass http://172.20.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }
    location /dash {
        proxy_pass http://172.20.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }
    location / {
        proxy_pass http://172.20.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # APK 稳定下载入口（2026-11-01 与净屏同款收敛）：反代轻服务 /dl/latest，
    # X-Accel-Redirect 内部重定向到真实版本化文件；后端响应带 no-store（稳定
    # 入口内容随发版变化）与 Content-Disposition 版本化文件名。
    location = /dl/latest {
        proxy_pass http://172.20.0.1:8090/dl/latest;
        proxy_set_header Host $host;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }
    # 历史版本下载面收敛（2026-11-01）：internal=外网直连任何版本化 URL（含拼
    # 接旧版本号）一律 404；磁盘文件保留可回滚，退出外网枚举面
    location /dl/ {
        internal;
        alias /srv/shiyin-apk/;
        autoindex off;
    }
}
