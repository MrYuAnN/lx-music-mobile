# 拾音对外域 — nginx-gateway 拾音专用 server block（方案 §二/§四）
#
# 部署位：nginx-gateway 仓 nginx/conf.d/（本文件 + shiyin-sec-headers.conf 两个都拷），
# 拷贝后 nginx -t && systemctl reload nginx
# 前提：
#   1.【对外域】= 境外注册商新购域名；EdgeOne 回源 Host 改写为【回源子域】
#      （已备案域 a-stock.top 系新子域，如 sy-api.a-stock.top——仅作 Host 头标识，
#      无需公网 A 记录；DNS-01 证书 SAN 必须覆盖它）。
#   2.【EdgeOne 回源 IP 段】= 官方 API 拉取的回源网段（会变化，须自动更新，
#      见 DEPLOY.md §6）；白名单外直连源站一律 403 拒绝。
#   3. 上游：轻服务 172.20.0.1:8090 / 取链服务 172.20.0.1:8091 / 平台 172.20.0.1:8080。
#
# add_header 继承陷阱（2026-10-26 审查 S-12）：location 内只要出现任一 add_header，
# server 级安全头即不继承——故全部动态 location 统一 include shiyin-sec-headers.conf
# （4 个安全头 + no-store）；/ 与 /dl/ 无 location 级 add_header，正常继承 server 级四件套。
#
# 上线检查单：证书 SAN 覆盖回源子域；回源 TLS 握手通过；白名单外直连源站被拒（403）；
# realip 生效（带 X-Forwarded-For 的回源请求，上游看到的 X-Real-IP=真实客户端 IP）；
# 动态接口禁缓存（本 block 响应头 + EdgeOne 控制台规则双保险，清单=/url /config /register
# /activate /redeem /device /api /latest /dash）；/dl/ APK 直链 200。
#
# CDN 真实客户端 IP 还原（2026-10-27 审查 C-1）：EdgeOne 前置下 $remote_addr=回源边缘 IP，
# 直接传给上游会让「注册 IP 日限」按边缘 IP 分桶（全员共享桶，误伤+可被耗尽）。
# realip 三件套把 $remote_addr 改写为 X-Forwarded-For 中的真实客户端 IP：
#   set_real_ip_from <EdgeOne 网段>（include 文件与白名单同源生成，见 DEPLOY.md §6）
#   real_ip_header X-Forwarded-For; real_ip_recursive on;
# 注意：仅本 server block 生效；净屏/投研 block 为直连形态，$remote_addr 本就是真实 IP，不动。
#
# 白名单观测日志（2026-10-27 拍板观测法白名单）：allow/deny 在 server 级，被 403 拒的
# 回源请求照样写 access_log——edge-allow-update.sh 据此观测新边缘 IP（三层判据：
# ssl_server_name∈拾音域 / XFF 非空=回源形态 / whois 腾讯归属）。$realip_remote_addr=
# realip 改写前的原始来源（=边缘 IP），$remote_addr 已被还原为真实用户 IP，勿混用。
# status 恒置行尾，脚本 awk '{print $NF}' 取用；分析后脚本原地清空该文件。

log_format shiyin_edge '$time_iso8601 $realip_remote_addr [$ssl_server_name] [$http_x_forwarded_for] "$request" $status';

# 回源白名单判定（geo 模块）：key=$realip_remote_addr（realip 改写前的原始来源=EdgeOne
# 边缘 IP）。不能用 server 级 allow/deny——realip 是 PREACCESS 阶段先于 ACCESS 的
# allow/deny 执行，$remote_addr 已被改写为终端用户 IP，allow 匹配对象会错成用户 IP
# （2026-10-27 首次切流实测：放行段内边缘 IP 全员 403 的根因）。
geo $realip_remote_addr $edge_allowed {
    default 0;
    include /etc/nginx/conf.d/shiyin-edge-allow.geo;
}

server {
    listen 80;
    server_name shiyinbox.top sy-api.a-stock.top;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name shiyinbox.top sy-api.a-stock.top;
    access_log /var/log/nginx/shiyin_edge.log shiyin_edge;

    # 证书 SAN 必须同时覆盖两个域名（certbot -d 两个都签；DNS-01 --manual：
    # shiyinbox.top TXT 在 EdgeOne 控制台加、sy-api.a-stock.top TXT 在阿里云控制台加，
    # 跨 DNS 商单插件不可行；lineage 名=回源子域，与 conf 引用一致）
    ssl_certificate     /etc/letsencrypt/live/sy-api.a-stock.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sy-api.a-stock.top/privkey.pem;

    # realip 还原（信任来源=EdgeOne 回源网段，include 与白名单同源自动更新）
    include /etc/nginx/conf.d/shiyin-edge-realip.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;


    # 安全响应头（仅对无 location 级 add_header 的路径生效：/ 与 /dl/；
    # 动态 location 见 shiyin-sec-headers.conf）
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- 回源 IP 白名单（防线 2）：geo 判定（原始来源=EdgeOne 边缘 IP，见顶部说明）----
    if ($edge_allowed = 0) { return 403; }

    # ---- 取链服务（fork lx-music-api-server，172.20.0.1:8091）----
    location /url/ {
        proxy_pass http://172.20.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }
    location /register {
        proxy_pass http://172.20.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }
    location /config {
        proxy_pass http://172.20.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }

    # ---- 平台公网端点（license-platform 172.20.0.1:8080；App 单域直打）----
    location /activate {
        proxy_pass http://172.20.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }
    location /redeem {
        proxy_pass http://172.20.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }
    location /device/ {
        proxy_pass http://172.20.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }
    location /api/ {
        proxy_pass http://172.20.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }

    # ---- 轻服务（172.20.0.1:8090）：/latest + /dash + 官网静态页 ----
    # /latest 永不设版本门槛（强升死锁防线，方案 §七）
    location /latest {
        proxy_pass http://172.20.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }
    location /dash {
        proxy_pass http://172.20.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/conf.d/shiyin-sec-headers.conf;
    }
    location / {
        proxy_pass http://172.20.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # APK 直链托管（DEPLOY.md §2 发布链的 url 指向此处；继承 server 级安全头，
    # 不加 no-store——APK 大文件允许 EdgeOne 边缘缓存省回源带宽）
    location /dl/ {
        alias /srv/shiyin-apk/;
        autoindex off;
    }
}
