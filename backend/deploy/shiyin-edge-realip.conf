# EdgeOne 回源网段 → realip 信任列表（审查 C-1：还原真实客户端 IP）
#
# 由 DEPLOY.md §6 的白名单自动更新任务与本仓 shiyin-edge-allow.conf 同源生成
# （同一份 CIDR 列表，两种指令形态）；网段会变化，禁手改。
# 作用：set_real_ip_from 信任列表内 IP 回源时，$remote_addr 被改写为
# X-Forwarded-For 链中的真实客户端 IP（real_ip_recursive on 从右向左弹出可信代理），
# 使上游 AuthMiddleware 的 request.state.ip（X-Real-IP）恢复为真实用户 IP——
# 注册 IP 日限的分桶身份才成立。
#
# 上线首版：由 EdgeOne 官方 API 拉取回源网段生成（参考 shiyin-edge-allow.conf 同步生成）；
# 本占位文件为空=realip 不生效（保持旧行为），网关上线前必须填充。

# set_real_ip_from <CIDR>;
# （由自动更新任务生成，示例形态：
# set_real_ip_from 43.174.246.0/24;
# set_real_ip_from 2402:4e00:::/32; ）
